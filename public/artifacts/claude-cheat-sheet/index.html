<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code Cheat Sheet</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0c10;--surface:#111318;--surface2:#181b22;--border:#1e2230;--orange:#ff6b35;--orange-dim:rgba(255,107,53,0.12);--teal:#00d4b4;--teal-dim:rgba(0,212,180,0.1);--purple:#a78bfa;--purple-dim:rgba(167,139,250,0.1);--yellow:#fbbf24;--yellow-dim:rgba(251,191,36,0.1);--text:#e8eaf0;--text-muted:#8b93a1;--text-dim:#9ca3af;--mono:'JetBrains Mono',monospace;--sans:'Syne',sans-serif}
html{background:var(--bg)}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;padding:32px 24px}
.header{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:18px;margin-bottom:24px;gap:16px;flex-wrap:wrap}
.header-left{display:flex;align-items:center;gap:14px}
.logo-box{width:44px;height:44px;background:var(--orange-dim);border:1px solid var(--orange);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.title{font-size:26px;font-weight:800;letter-spacing:-0.5px}
.title span{color:var(--orange)}
.subtitle{font-size:11px;color:var(--text-muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:1.5px}
.badge{font-family:var(--mono);font-size:11px;font-weight:700;background:var(--orange-dim);border:1px solid var(--orange);color:var(--orange);padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:580px){.grid{grid-template-columns:1fr}}
.col-span-2{grid-column:span 2}
.col-span-3{grid-column:span 3}
@media(max-width:900px){.col-span-3,.col-span-2{grid-column:span 2}}
@media(max-width:580px){.col-span-3,.col-span-2{grid-column:span 1}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent-color,var(--orange));opacity:0.7}
.card.teal{--accent-color:var(--teal)}
.card.purple{--accent-color:var(--purple)}
.card.yellow{--accent-color:var(--yellow)}
.card.orange{--accent-color:var(--orange)}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.8px;margin-bottom:12px;color:var(--accent-color,var(--orange));display:flex;align-items:center;gap:7px}
.card-title::after{content:'';flex:1;height:1px;background:var(--accent-color,var(--orange));opacity:0.2}
.cmd-row{display:flex;align-items:baseline;gap:10px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.cmd-row:last-child{border-bottom:none;padding-bottom:0}
.cmd{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--teal);white-space:nowrap;flex-shrink:0;background:var(--teal-dim);padding:2px 7px;border-radius:4px}
.cmd.o{color:var(--orange);background:var(--orange-dim)}
.cmd.p{color:var(--purple);background:var(--purple-dim)}
.cmd.y{color:var(--yellow);background:var(--yellow-dim)}
.cmd-desc{color:var(--text-dim);font-size:11.5px;line-height:1.4}
.shortcut-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);gap:10px}
.shortcut-row:last-child{border-bottom:none}
.keys{display:flex;gap:4px;flex-shrink:0}
kbd{font-family:var(--mono);font-size:11px;font-weight:600;background:var(--surface2);border:1px solid #2a2f3d;border-bottom:2px solid #2a2f3d;border-radius:4px;padding:2px 6px;color:var(--text);white-space:nowrap}
.shortcut-desc{color:var(--text-dim);font-size:11.5px}
.tips-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tip{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:10px 12px;font-size:11.5px;line-height:1.5;color:var(--text-dim);position:relative}
.tip strong{color:var(--text);font-weight:600;display:block;margin-bottom:2px}
.tip-num{position:absolute;top:8px;right:10px;font-family:var(--mono);font-size:11px;color:var(--text-muted);font-weight:700}
.fblock{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:10px 12px;font-family:var(--mono);font-size:11px;color:var(--text-dim);line-height:1.75}
.fblock .cm{color:var(--text-muted)}
.fblock .k{color:var(--purple)}
.fblock .v{color:var(--teal)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.citem{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:11.5px;display:flex;gap:8px;align-items:flex-start}
.cdot{width:6px;height:6px;border-radius:50%;background:var(--orange);flex-shrink:0;margin-top:4px}
.cdot.t{background:var(--teal)}
.cdot.p{background:var(--purple)}
.cdot.y{background:var(--yellow)}
.ctxt{color:var(--text-dim);line-height:1.5}
.ctxt strong{color:var(--text)}
.footer{margin-top:18px;display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--text-muted);border-top:1px solid var(--border);padding-top:12px;flex-wrap:wrap;gap:8px}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:0.8px;margin-right:4px;vertical-align:middle}
.pt{background:var(--teal-dim);color:var(--teal);border:1px solid rgba(0,212,180,0.25)}
.po{background:var(--orange-dim);color:var(--orange);border:1px solid rgba(255,107,53,0.25)}
.pp{background:var(--purple-dim);color:var(--purple);border:1px solid rgba(167,139,250,0.25)}
.ic{font-family:var(--mono);font-size:11px;background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:1px 5px;color:var(--teal)}
.note{font-size:11px;color:var(--text-muted);line-height:1.5;background:var(--surface2);border-radius:6px;padding:7px 9px;border:1px solid var(--border);margin-top:8px}
.p{font-size:11.5px;color:var(--text-dim);line-height:1.5;margin-bottom:10px}
.cmd-row+.p,.cmd-row+.fblock,.cmd-row+.cgrid{margin-top:8px}
.cmd-row.hi{background:rgba(255,107,53,0.06);border-radius:4px}
.fblock{white-space:pre-wrap}
.key-note{font-size:11px;color:var(--text-muted);align-self:center}
.note kbd,.tip kbd{padding:1px 5px;border-bottom-width:1px;background:var(--surface)}
.card.purple .ic{color:var(--purple);background:var(--purple-dim)}
.card.orange .note .ic{color:var(--orange);background:var(--orange-dim)}
.cols{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:0 16px}
.col-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent-color,var(--orange));margin-bottom:8px}
.col-h~.cmd-row{padding:4px 0}
.col-h~.cmd-row .cmd-desc{font-size:11px}
</style>
</head>

  <div class="header-left">
    <div class="logo-box">⌘</div>

      <div class="title">Claude <span>Code</span> Cheat Sheet</div>

  { title: 'System Prompt Flags', color: 'purple', blocks: [

      ['Build your CLAUDE.md on day one', 'Run `/init`, then edit it. Add build commands, stack details, lint rules, and coding conventions — Claude reads it every session.'],
      ['Add hooks to enforce code quality', 'Use `PostToolUse` hooks to auto-run formatters (Prettier, Black) and type-checkers after every file write.'],
      ['Esc to redirect, Esc Esc to rewind', 'Esc interrupts mid-task and keeps the work done so far. Double-Esc on an empty prompt opens the rewind menu to roll back conversation and/or code.'],
      ['Use /compact for long sessions', 'When context grows large, `/compact` summarizes history and keeps Claude sharp — especially important for complex multi-file tasks.'],
      ['Paste screenshots', 'Use [[Ctrl+V]] (or Cmd+V in iTerm2) to drop an image chip into your prompt for visual debugging context.'],
      ['Set a /goal for long work', '`/goal all tests pass` keeps Claude iterating across turns until the condition holds — no more "continue" prompts.'],
      ['Ask side questions with /btw', '`/btw` answers a quick question about the session without polluting the main context.'],
    ] },
  ] },
];

// ── Renderer (no need to edit below) ──
const CMD = { teal: '', orange: 'o', purple: 'p', yellow: 'y' };
const DOT = { teal: 't', orange: '', purple: 'p', yellow: 'y' };
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const md = s => s.replace(/`([^`]+)`/g, (_, c) => `<span class="ic">${esc(c)}</span>`).replace(/\[\[(.+?)\]\]/g, '<kbd>$1</kbd>');
const lines = s => {
  const l = s.replace(/^\n+|\s+$/g, '').split('\n');
  const n = Math.min(...l.filter(x => x.trim()).map(x => x.match(/^ */)[0].length));
  return l.map(x => x.slice(n));
};
const span = (cls, s) => `<span class="${cls}">${s}</span>`;
const hlLine = line => {
  const e = esc(line);
  if (/^\s*(#(?!#)|\/\/)/.test(line)) return span('cm', e);
  if (/^\s*##/.test(line)) return span('k', e);
  if (line.includes('"')) return e.replace(/("[^"]*")(\s*:)?/g, (_, q, c) => c ? span('k', q) + c : span('v', q));
  const y = e.match(/^(\s*)([\w-]+)(:\s*[|>]?)$/);
  if (y) return y[1] + span('k', y[2]) + y[3];
  return /^[\s{}[\],]*$/.test(line) ? e : span('v', e);
};
const block = (b, a) => {
  if (b.cmds) return b.cmds.map(([c, d, hi]) => `<div class="cmd-row${hi ? ' hi' : ''}"><span class="cmd ${CMD[a]}">${esc(c)}</span><span class="cmd-desc">${md(d)}</span></div>`).join('');
  if (b.keys) return b.keys.map(([k, d]) => `<div class="shortcut-row"><div class="keys">${k.split(' ').map(x => x[0] === '+' && x.length > 1 ? span('key-note', esc(x)) : `<kbd>${esc(x)}</kbd>`).join('')}</div><span class="shortcut-desc">${md(d)}</span></div>`).join('');
  if (b.code) return `<div class="fblock">${lines(b.code).map(hlLine).join('\n')}</div>`;
  if (b.events) return `<div class="fblock">${lines(b.events).map(l => esc(l).replace(/\b[A-Z]\w*/g, m => span('k', m))).join('\n')}</div>`;
  if (b.chips) return `<div class="cgrid">${b.chips.map(([n, d, c]) => `<div class="citem"><div class="cdot ${DOT[c]}"></div><div class="ctxt"><strong>${n}</strong> — ${md(d)}</div></div>`).join('')}</div>`;
  if (b.tips) return `<div class="tips-grid">${b.tips.map(([t, d], i) => `<div class="tip"><span class="tip-num">${String(i + 1).padStart(2, '0')}</span><strong>${t}</strong>${md(d)}</div>`).join('')}</div>`;
  if (b.cols) return `<div class="cols" style="--n:${b.cols.length}">${b.cols.map(col => `<div>${col.map(x => block(x, a)).join('')}</div>`).join('')}</div>`;
  if (b.h) return `<div class="col-h">${b.h}</div>`;
  if (b.p) return `<p class="p">${md(b.p)}</p>`;
  if (b.note) return `<div class="note">${md(b.note)}</div>`;
  throw new Error('Unknown block: ' + JSON.stringify(b));
};
const card = c => `<div class="card ${c.color}${c.span ? ' col-span-' + c.span : ''}"><div class="card-title">${c.title}</div>${c.blocks.map(b => block(b, c.color)).join('')}</div>`;
document.querySelector('.grid').innerHTML = CARDS.map(card).join('');
</script>
